<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image opacity effect</title>
    <style>
.hover-image{
    width: 300px;
    opacity: 1;
    transition: opacity 0.3s ease;
    color: brown;
}
.hover-image:hover{
    opacity: 0.4;
}
    </style>
</head>
    <h2>image</h2>
    <img src="images (2).jpg" alt="sample image" class="hover-image">
</body>
</html>
