<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMAP</title>
</head>
<body>

    <h2>Multiple Shapes</h2>

    <img src="2.jpg" usemap="#map5" width="500" height="300">

    <map name="map5">

        <area shape="rect" coords="20,20,150,100"
            href="2.jpg" alt="Rectangle">

        <area shape="circle" coords="300,80,50"
            href="2.jpg" alt="Circle">

        <area shape="poly" coords="180,180,250,120,320,180,250,250"
            href="2.jpg" alt="Polygon">

    </map>

</body>
</html>
