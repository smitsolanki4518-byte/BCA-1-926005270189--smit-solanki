<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMAP</title>
</head>
<body>

    <h2>Circle Image Map</h2>

    <img src="2.jpg" usemap="#map2" width="500" height="300">

    <map name="map2">
        <area shape="circle" coords="250,150,80"
            href="2.jpg" alt="Circle">
    </map>

</body>
</html>
