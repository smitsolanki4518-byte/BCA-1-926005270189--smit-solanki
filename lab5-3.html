<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMAP</title>
</head>
<body>

    <h2>Polygon Image Map</h2>

    <img src="2.jpg" usemap="#map3" width="500" height="300">

    <map name="map3">
        <area shape="poly"
            coords="100,50,200,50,250,150,150,250,50,150"
            href="2.jpg" alt="Polygon">
    </map>

</body>
</html>
